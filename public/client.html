<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공포 방탈출</title>
  <link rel="stylesheet" href="client.css">
</head>
<body>
  <div id="blood-drip"></div>
  
  <div class="screen active" id="room-selection">
    <div class="title">
      <h1>🔥 공포 방탈출 🔥</h1>
      <p>방을 선택하세요</p>
    </div>
    <div class="room-grid">
      <div class="room-card" id="room-1">
        <h2>폐병원</h2>
        <p>난이도: ★★★★★</p>
      </div>
      <div class="room-card" id="room-2">
        <h2>크리스마스 악몽</h2>
        <p>난이도: ★★★☆☆</p>
      </div>
      <div class="room-card" id="room-3">
        <h2>호텔</h2>
        <p>난이도: ★★★★☆</p>
      </div>
      <div class="room-card" id="room-4">
        <h2>대기실</h2>
        <p>난이도: ☆☆☆☆☆</p>
      </div>
    </div>
  </div>

  <div class="screen" id="team-name-screen">
    <div class="title">
      <h1>팀 이름을 입력하세요</h1>
    </div>
    <div class="team-name-container">
      <input type="text" id="team-name-input" placeholder="팀 이름" maxlength="20">
      <button id="submit-team-btn">시작하기</button>
    </div>
  </div>

  <div class="screen" id="game-screen">
    <div class="blood-splash"></div>
    
    <div class="game-header">
      <div id="timer">00:00:00</div>
      <div id="penalty-display">패널티: +0초</div>
    </div>
    
    <div class="password-container">
      <div id="password-display">0000</div>
      <div id="wrong-message" class="hidden">틀렸다... 다시 시도하라...</div>
    </div>
    
    <div class="numpad">
      <button class="numpad-btn" data-num="1">1</button>
      <button class="numpad-btn" data-num="2">2</button>
      <button class="numpad-btn" data-num="3">3</button>
      <button class="numpad-btn" data-num="4">4</button>
      <button class="numpad-btn" data-num="5">5</button>
      <button class="numpad-btn" data-num="6">6</button>
      <button class="numpad-btn" data-num="7">7</button>
      <button class="numpad-btn" data-num="8">8</button>
      <button class="numpad-btn" data-num="9">9</button>
      <button class="numpad-btn" id="clear-btn">C</button>
      <button class="numpad-btn" data-num="0">0</button>
      <button class="numpad-btn" id="submit-password-btn">✓</button>
    </div>
    
    <button id="hint-request-btn" class="hint-btn">💡 힌트 요청</button>
  </div>

  <div class="screen" id="success-screen">
    <div class="title">
      <h1>🎉 탈출 성공! 🎉</h1>
      <div class="success-info">
        <p id="final-time">완료 시간: 00:00:00</p>
        <p id="final-penalty">패널티: +0초</p>
      </div>
    </div>
  </div>

  <div id="hint-popup" class="hint-popup hidden">
    <div class="hint-content"></div>
  </div>

  <div id="hint-request-popup" class="hint-request-popup hidden">
    <div class="hint-request-content">
      <h3>힌트 요청</h3>
      <textarea id="hint-request-text" placeholder="어떤 힌트가 필요한가요?"></textarea>
      <div class="hint-request-buttons">
        <button id="send-hint-request-btn">전송</button>
        <button id="cancel-hint-request-btn">취소</button>
      </div>
    </div>
  </div>

  <audio id="ambient-sound" loop></audio>
  <audio id="announcement-sound"></audio>
  <audio id="effect-sound"></audio>
  <audio id="success-sound" src="sounds/success.mp3"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
